<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="profile-card text-center p-4">

        <div class="profile-img">
            <img src="img/woman-profile.jpg" alt="Profile Picture">
        </div>
        <h3 class="mt-3 fw-bold">Aninditha Zahra</h3>
        <p class="text-light mt-1 location-text">
            <i class="bi bi-geo-alt-fill"></i>
            <a href="https://www.google.com/maps/search/Jakarta,+Indonesia" target="_blank" class="location-link">
                Jakarta, Indonesia
            </a>
        </p>
        <p class="small-text">
            UI/UX designer and front-end developer
        </p>

        <div class="d-flex justify-content-center gap-3 mt-3">
            <a href="https://github.com/" target="_blank" class="btn-social">
                <i class="bi bi-github"></i>
            </a>
            <a href="https://instagram.com/" target="_blank" class="btn-social">
                <i class="bi bi-instagram"></i>
            </a>
            <a href="https://linkedin.com/" target="_blank" class="btn-social">
                <i class="bi bi-linkedin"></i>
            </a>
        </div>
        <div class="skills mt-5 text-start">
            <h6 class="fw-bold text-light">SKILLS</h6>
            <div class="skills-list mt-2">
                UI/UX • Front End Development • HTML • CSS • Javascript • React • Bootstrap
            </div>
        </div>
    </div>
</body>
</html>
